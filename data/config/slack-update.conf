# Slack-Update reference configuration
#
# This file is parsed as data. It is never sourced as shell code.
# Copy it to /etc/slack-update/slack-update.conf when installing the
# reference script under /usr/local/sbin/slack-update.
# Optional module modes are enabled, disabled, or auto.

[core]
schema_version=1
work_dir=/var/lib/slack-update
log_dir=/var/log/slack-update
lock_file=/var/run/slack-update.lock
log_retention_days=30
package_database=/var/log/packages

[slackware]
install_new=true
upgrade_all=true

[flatpak]
mode=auto

[sbo]
mode=auto
sbopkg_config=/etc/sbopkg/sbopkg.conf
queue_dir_fallback=/var/lib/sbopkg/queues
package_tag=_SBo

[elf]
mode=auto
scan_paths=/usr/bin:/usr/sbin:/usr/libexec:/opt

[packages]
abi=glibc gcc glib2 dbus libffi zlib zstd lz4 mesa gtk+3 gtk4 cairo cairomm1 pango harfbuzz libdrm libinput gtkmm3 openexr ffmpeg gstreamer gst-plugins-base pipewire openssl openssl-solibs gnutls curl libpng libjpeg-turbo libtiff alsa-lib libvorbis libopus flac nss nspr
cinnamon_abi=mesa gtk+3 gtk4 cairo pango harfbuzz libdrm libinput ffmpeg openexr gtkmm3 cairomm1 libX11 libxcb libXext libXrender atk
critical=glibc dbus openssl openssl-solibs
kernel=kernel-generic kernel-huge kernel-modules kernel-headers
kernel_boot=kernel-generic kernel-huge kernel-modules
kernel_headers=kernel-headers

[boot]
mode=auto
mkinitrd_config=/etc/mkinitrd.conf
initrd_default_output=/boot/initrd.gz
grub_directory=/boot/grub
grub_config=/boot/grub/grub.cfg

[cinnamon]
mode=auto
repository=/var/lib/slack-update/csb
remote=https://github.com/CinnamonSlackBuilds/csb.git
branch=master
builder=build-cinnamon.sh
